name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Note: no global RUSTFLAGS: -D warnings. Cargo would apply it to every
  # dependency as well, so a warning in an upstream crate we do not control
  # would fail the build. The lint job denies warnings for this crate instead.

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's result is wanted, especially Windows: the interpreter
      # fallback and the build instructions are untested claims until this runs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The Python provider and reward factory both shell out to an
      # interpreter, and the end-to-end tests exercise them.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-targets

  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Proves the README's build instructions work on each platform. Shipping
      # the artefacts is a separate concern (roadmap section 5).
      - name: Build
        run: cargo build --release --locked
