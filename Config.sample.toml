# Sample configuration for Aixker-RLT CLI (the `rlt` command).
#
# Copy to Config.toml and edit. Every key is optional: an absent key falls back
# to the built-in default noted beside it. Command-line flags override this
# file, and this file overrides the defaults.
#
# The config file itself is optional too — without one the CLI runs on the
# built-in defaults.

# --- Data ---------------------------------------------------------------

# Data source. A ".py" path starts the Python script provider; anything else is
# read as CSV. Supply your own data. Overridden by --dataset.
dataset = "./your-data.csv"

# Skip the first CSV row instead of parsing it as data. Overridden by
# --has-header. Default: false
has_header = false

# CSV field separator; a single ASCII character. Overridden by --delimiter.
# Default: ","
delimiter = ","

# --- Model --------------------------------------------------------------

# Checkpoint name. Written under ./models/. Overridden by --model-name.
model_name = "model-128.json"

# Number of values in each row of your data. A mismatch is reported before
# training starts. Default: 8
input_number = 6

# Number of actions the model can choose from. Default: 3
output_number = 3

# Hidden layer width. Default: 16
hidden_layers = 16

# --- Training -----------------------------------------------------------

# Samples per training batch. Overridden by --batch-size. Default: 32
batch_size = 128

# Total training batches. The --epochs flag sets this as epochs x 100 and takes
# precedence over this value. Default: 1000
total_batches = 20000

# Replay buffer capacity. Default: 4096
reply_capacity = 4096

# Python script computing reward and success per step. Overridden by
# --reward-script. Optional; without it every reward is 0.0.
reward_script = "./scripts/reward_script.py"

# Seconds to wait for a Python script — data provider or reward script — to
# answer one request. Overridden by --script-timeout. A script that never
# answers would otherwise hang the CLI with no output at all. Set to 0 to wait
# forever. Default: 30
script_timeout_secs = 30

# --- Learning -----------------------------------------------------------
#
# Every key here is optional, and the defaults are aixker-rlt 0.2.0's own.
# Change them knowingly; the defaults are what the library was tested with.

# Seed for every random choice: weight init, exploration, action sampling and
# replay sampling. The same seed, data and settings train the same weights.
# Overridden by --seed. Default: unset (each run differs)
# seed = 42

# Rewrite rewards with the library's built-in shaping, which penalises failed
# and over-used actions by up to about 0.5. Off by default: it swamps small
# rewards and taught 0.1.0 policies a single fixed action. Only consider it when
# rewards are on the order of +/-1. Overridden by --reward-shaping.
# Default: false
# reward_shaping = false

# SGD step size, applied once per batch. Overridden by --learning-rate.
# Default: 0.05
# learning_rate = 0.05

# Clip each update so its gradient norm is at most this. 0 turns clipping off.
# Default: 1.0
# max_grad_norm = 1.0

# Weight of the entropy bonus, which keeps the policy from becoming confident
# before the reward supports it. 0 turns it off. Default: 0.1
# entropy_coef = 0.1

# Exploration schedule. The random-action rate (epsilon) and the sampling
# temperature move in a straight line from their start to their end values
# during the first `exploration_batches` batches, then stay there.
# Defaults: 0.3 -> 0.05, 1.5 -> 1.0, over 500 batches
# epsilon_start = 0.3
# epsilon_end = 0.05
# temperature_start = 1.5
# temperature_end = 1.0
# exploration_batches = 500

# Sampling temperature for infer and eval. They never take random actions; 0
# always takes the highest-scoring action. Overridden by --infer-temperature.
# Default: 0.5
# infer_temperature = 0.5

# --- Runtime ------------------------------------------------------------

# Seconds slept between samples during inference; training ignores it.
# Overridden by --interval-secs. Leave it unset to get the right default from
# the dataset: 0 for a file, since the rows are already there, and 10 for a .py
# provider, which is sampling a live source. Setting it here applies to both.
interval_secs = 10

# Log one line of training statistics every N batches: reward mean and spread,
# loss, gradient norm, exploration, the policy's action mix and its entropy.
# 0 turns it off. Default: 64
log_interval = 64

# Compute backend: "Cpu" (default) or "Gpu". Overridden by --backend.
# backend = "Gpu"

# Note: a "mode" key has no effect — the subcommand decides whether the run
# trains or infers. Unknown keys are ignored.
