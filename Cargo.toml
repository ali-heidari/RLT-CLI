[package]
name = "aixker-rlt-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for training, evaluating and serving Aixker-RLT policies"
license = "Apache-2.0"
repository = "https://github.com/ali-heidari/RLT-CLI"
# Set by the dependency tree rather than by this crate: wgpu 28, pulled in by
# aixker-rlt's GPU backend, requires 1.92. Declaring it turns an obscure
# dependency-resolution error into a clear "your toolchain is too old".
rust-version = "1.92"

# The crate is aixker-rlt-cli; the command people type is `rlt`. Cargo also
# warned that the old uppercase-and-hyphen crate name was non-idiomatic.
[[bin]]
name = "rlt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# Pinned deliberately. Every workaround in this CLI — the doubled checkpoint
# path, the empty-checkpoint guard, all of docs/found-issues.md — is written
# against this revision. An unpinned git dependency resolves to whatever the
# default branch points at today, so one upstream push would silently
# invalidate the lot.
aixker-rlt = { git = "https://github.com/ali-heidari/Aixker-RLT", rev = "b0603e0" }
csv = "1.3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
